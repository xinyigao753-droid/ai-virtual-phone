plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名：CI 里通过环境变量注入 keystore（见 android-shell/README.md）；
// 没有配置时 release 构建产出未签名 APK，debug 构建始终可直接安装测试。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
def configuredSiteUrl = System.getenv("SHELL_SITE_URL")?.trim()
if (!configuredSiteUrl) {
    throw new GradleException("SHELL_SITE_URL 未设置：请在 GitHub Actions 的 site_url 或仓库变量中填写 HTTPS 站点地址")
}
def siteUrl = configuredSiteUrl.replaceAll('/+$', '')
try {
    def parsedSiteUrl = new java.net.URI(siteUrl)
    if (parsedSiteUrl.scheme != 'https' || !parsedSiteUrl.host) {
        throw new GradleException("SHELL_SITE_URL 必须是完整的 HTTPS 地址")
    }
} catch (GradleException error) {
    throw error
} catch (Exception error) {
    throw new GradleException("SHELL_SITE_URL 不是有效的 HTTPS 地址", error)
}

android {
    namespace 'app.floatphone.shell'
    compileSdk 34

    defaultConfig {
        applicationId "app.floatphone.shell"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("SHELL_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHELL_KEY_ALIAS")
                keyPassword System.getenv("SHELL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
